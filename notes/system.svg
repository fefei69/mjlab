<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 670" width="980" height="670" role="img" aria-label="System overview: an MPPI planner sends velocity commands to an RL tracking policy, which drives a simulated Go1. The planner adapts by re-fitting a residual in its motion model, and the policy adapts through its observation history." font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
  </defs>

  <!-- Card background, so the figure reads the same on light and dark pages. -->
  <rect x="0.5" y="0.5" width="979" height="669" rx="10" fill="#ffffff" stroke="#d0d7de"/>

  <!-- Layer bands. -->
  <rect x="20" y="20" width="940" height="226" rx="8" fill="#eef5ff"/>
  <rect x="20" y="300" width="940" height="110" rx="8" fill="#eefbf1"/>
  <rect x="20" y="456" width="940" height="96" rx="8" fill="#f3f4f6"/>

  <g font-size="12" fill="#424a53">
    <text x="40" y="44" font-weight="700" letter-spacing="0.6">PLANNER</text>
    <text x="40" y="60">optimal control · 10 Hz</text>
    <text x="40" y="330" font-weight="700" letter-spacing="0.6">TRACKER</text>
    <text x="40" y="346">learned policy · 50 Hz</text>
    <text x="40" y="486" font-weight="700" letter-spacing="0.6">ROBOT</text>
    <text x="40" y="502">simulation</text>
  </g>

  <!-- Boxes that exist today: solid outline. -->
  <g fill="#ffffff" stroke="#57606a" stroke-width="1.5">
    <rect x="40" y="76" width="150" height="80" rx="6"/>
    <rect x="230" y="66" width="260" height="100" rx="6"/>
    <rect x="605" y="90" width="155" height="60" rx="6"/>
    <rect x="230" y="312" width="260" height="86" rx="6"/>
    <rect x="230" y="470" width="260" height="68" rx="6"/>
  </g>
  <!-- The motion model is a group of two parts. -->
  <rect x="590" y="56" width="350" height="176" rx="8" fill="none" stroke="#8c959f" stroke-width="1"/>

  <!-- Planned parts: dashed outline. Orange fill marks where the system adapts. -->
  <g stroke-width="1.5" stroke-dasharray="6 4">
    <rect x="785" y="90" width="140" height="60" rx="6" fill="#fff1dc" stroke="#b35900"/>
    <rect x="605" y="178" width="320" height="44" rx="6" fill="#fff1dc" stroke="#b35900"/>
    <rect x="242" y="362" width="236" height="26" rx="5" fill="#fff1dc" stroke="#b35900"/>
    <rect x="230" y="590" width="260" height="60" rx="6" fill="#ffffff" stroke="#57606a"/>
  </g>

  <!-- Box text. -->
  <g fill="#1f2328" text-anchor="middle">
    <g font-size="14" font-weight="700">
      <text x="115" y="106">Task</text>
      <text x="360" y="100">MPPI planner</text>
      <text x="682.5" y="116">Nominal model</text>
      <text x="855" y="116">Residual</text>
      <text x="360" y="336">Tracking policy (PPO)</text>
      <text x="360" y="498">Go1 robot</text>
      <text x="360" y="615">Leg damage</text>
    </g>
    <g font-size="12.5">
      <text x="115" y="126">a path to follow,</text>
      <text x="115" y="143">as a cost</text>
      <text x="360" y="122">samples command sequences,</text>
      <text x="360" y="140">keeps the low-cost ones</text>
      <text x="682.5" y="136">fitted offline</text>
      <text x="855" y="136">re-fitted online</text>
      <text x="765" y="205">Online fit: least squares on the last second</text>
      <text x="360" y="354">turns commands into joint targets</text>
      <text x="360" y="380" font-size="12">observation history: adapts its gait</text>
      <text x="360" y="518">simulated in mjlab on MuJoCo Warp</text>
      <text x="360" y="635">calf cut off or knee motor dead</text>
    </g>
    <text x="772.5" y="126" font-size="18" font-weight="700" fill="#57606a">+</text>
  </g>
  <text x="605" y="78" font-size="12.5" font-weight="700" fill="#424a53">Planar motion model</text>

  <!-- Arrows. -->
  <g fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)">
    <path d="M 190 116 H 229"/>
    <path d="M 490 100 H 589"/>
    <path d="M 590 132 H 491"/>
    <path d="M 360 166 V 311"/>
    <path d="M 360 398 V 469"/>
    <path d="M 490 490 H 550 V 355 H 491"/>
    <path d="M 490 520 H 770 V 223"/>
    <path d="M 230 504 H 205 V 276 H 290 V 167"/>
    <path d="M 360 590 V 539"/>
    <path d="M 855 178 V 151"/>
  </g>

  <!-- Arrow labels. -->
  <g font-size="12" fill="#424a53">
    <text x="209.5" y="108" text-anchor="middle">cost</text>
    <text x="540" y="92" text-anchor="middle">commands</text>
    <text x="540" y="150" text-anchor="middle">predicted paths</text>
    <text x="372" y="268">velocity command · 10 Hz</text>
    <text x="372" y="284">forward, sideways, yaw rate</text>
    <text x="372" y="438">joint position targets · 50 Hz</text>
    <text x="560" y="424">joint angles and</text>
    <text x="560" y="440">body motion · 50 Hz</text>
    <text x="780" y="424">commanded and</text>
    <text x="780" y="440">achieved motion</text>
    <text x="195" y="424" text-anchor="end">base pose</text>
    <text x="195" y="440" text-anchor="end">and velocity</text>
    <text x="372" y="574">at a random time</text>
    <text x="865" y="169">updates</text>
  </g>

  <!-- Legend. -->
  <g font-size="12" fill="#424a53">
    <rect x="560" y="612" width="26" height="16" rx="3" fill="#ffffff" stroke="#57606a" stroke-width="1.5"/>
    <text x="594" y="624">built</text>
    <rect x="650" y="612" width="26" height="16" rx="3" fill="#ffffff" stroke="#57606a" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="684" y="624">planned</text>
    <rect x="760" y="612" width="26" height="16" rx="3" fill="#ffd9a0"/>
    <text x="794" y="624">adapts online</text>
  </g>
</svg>
